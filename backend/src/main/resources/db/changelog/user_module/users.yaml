databaseChangeLog:
  - changeSet:
      id: create-users-table
      author: system
      changes:
        - createTable:
            schemaName: user_module
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
              - column:
                  name: username
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(100)
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: last_login
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP 