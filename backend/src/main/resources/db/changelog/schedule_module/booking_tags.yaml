databaseChangeLog:
  - changeSet:
      id: create-booking-tags-table
      author: system
      changes:
        - createTable:
            schemaName: schedule_module
            tableName: booking_tags
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: booking_id
                  type: INT
              - column:
                  name: tag_id
                  type: INT 