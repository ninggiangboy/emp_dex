databaseChangeLog:
  - changeSet:
      id: create-bookings-table
      author: system
      changes:
        - createTable:
            schemaName: schedule_module
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(100)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: start_time
                  type: DATETIME
              - column:
                  name: end_time
                  type: DATETIME
              - column:
                  name: room_id
                  type: INT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: INT
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: INT
              - column:
                  name: deleted_at
                  type: TIMESTAMP 