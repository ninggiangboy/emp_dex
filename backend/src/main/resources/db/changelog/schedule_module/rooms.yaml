databaseChangeLog:
  - changeSet:
      id: create-rooms-table
      author: system
      changes:
        - createTable:
            schemaName: schedule_module
            tableName: rooms
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: color
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: INT
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: INT
              - column:
                  name: deleted_at
                  type: TIMESTAMP 