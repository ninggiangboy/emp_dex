databaseChangeLog:
  - changeSet:
      id: create-recruitment-tags-table
      author: system
      changes:
        - createTable:
            schemaName: recruitment_module
            tableName: recruitment_tags
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(50)
              - column:
                  name: color
                  type: VARCHAR(20)
              - column:
                  name: deleted_at
                  type: TIMESTAMP 