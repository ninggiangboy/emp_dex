databaseChangeLog:
  - changeSet:
      id: create-application-comments-table
      author: system
      changes:
        - createTable:
            schemaName: recruitment_module
            tableName: application_comments
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: application_id
                  type: INT
              - column:
                  name: user_id
                  type: INT
              - column:
                  name: comment
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: INT
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: deleted_at
                  type: TIMESTAMP 