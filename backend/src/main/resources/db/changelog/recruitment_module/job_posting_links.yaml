databaseChangeLog:
  - changeSet:
      id: create-job-posting-links-table
      author: system
      changes:
        - createTable:
            schemaName: recruitment_module
            tableName: job_posting_links
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: job_description_id
                  type: INT
              - column:
                  name: platform
                  type: VARCHAR(20)
              - column:
                  name: link
                  type: VARCHAR(255)
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: deleted_at
                  type: TIMESTAMP 