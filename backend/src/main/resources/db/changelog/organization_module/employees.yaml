databaseChangeLog:
  - changeSet:
      id: create-employees-table
      author: system
      changes:
        - createTable:
            schemaName: organization_module
            tableName: employees
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: first_name
                  type: VARCHAR(50)
              - column:
                  name: last_name
                  type: VARCHAR(50)
              - column:
                  name: company_email
                  type: VARCHAR(100)
              - column:
                  name: personal_email
                  type: VARCHAR(100)
              - column:
                  name: phone
                  type: VARCHAR(20)
              - column:
                  name: avatar_url
                  type: VARCHAR(255)
              - column:
                  name: date_of_birth
                  type: DATE
              - column:
                  name: education_level
                  type: VARCHAR(20)
              - column:
                  name: education_institution
                  type: VARCHAR(100)
              - column:
                  name: work_type
                  type: VARCHAR(20)
              - column:
                  name: gender
                  type: VARCHAR(20)
              - column:
                  name: level
                  type: VARCHAR(20)
              - column:
                  name: status
                  type: VARCHAR(20)
              - column:
                  name: department_id
                  type: INT
              - column:
                  name: joined_at
                  type: DATE
              - column:
                  name: org_lft
                  type: INT
              - column:
                  name: org_rgt
                  type: INT
              - column:
                  name: deleted_at
                  type: TIMESTAMP 