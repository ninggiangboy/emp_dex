databaseChangeLog:
  - changeSet:
      id: create-departments-table
      author: system
      changes:
        - createTable:
            schemaName: organization_module
            tableName: departments
            columns:
              - column:
                  name: id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: color
                  type: VARCHAR(20)
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: deleted_at
                  type: TIMESTAMP 